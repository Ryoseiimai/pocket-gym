name: バグ報告
description: 動作がおかしい・エラーが出る等を報告してください
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きましたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの画面で何をしたら起きたか、順番に書いてください
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待していた動作
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: 端末・ブラウザ
      placeholder: 例) iPhone 15 / Safari
    validations:
      required: false
