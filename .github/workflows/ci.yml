name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run unit tests (app)
        run: node --test app/tests/*.test.js

      - name: node --check (構文チェック)
        run: |
          set -e
          for f in $(find app/js -name "*.js"); do
            echo "checking $f"
            node --check "$f"
          done

      - name: 静的チェック(禁止パターンの検出・LP + app)
        run: bash .github/scripts/static-checks.sh .
